get_history:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: github_pulse
    start:
      required: false
      example: "2025-01"
      selector:
        text:
    end:
      required: false
      example: "2026-10"
      selector:
        text:
    include_languages:
      required: false
      default: true
      selector:
        boolean:

query:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: github_pulse
    query:
      required: true
      example: "query { viewer { login } }"
      selector:
        text:
          multiline: true
    variables:
      required: false
      selector:
        object:

year_in_review:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: github_pulse
    year:
      required: false
      example: 2025
      selector:
        number:
          min: 2008
          max: 2100
          mode: box
