[project]
name = "ha-github-pulse"
version = "0.1.0"
description = "Home Assistant integration for GitHub account and repository activity"
requires-python = ">=3.14"
license = { text = "MIT" }

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "ASYNC", "PL", "TID",
]
ignore = [
  "PLR2004", # magic values are fine in tests and thresholds
  "PLR0913", # coordinators and API helpers take many keyword arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]
"scripts/**" = ["S310", "E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = []
mypy_path = "."
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
